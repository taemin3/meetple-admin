name: Test and deploy admin

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  NODE_VERSION: 22.23.2

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build application
        env:
          VITE_API_BASE_URL: ""
        run: pnpm build

  deploy:
    name: Deploy staging
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.AUTO_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: staging-admin-deployment
      cancel-in-progress: true

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        env:
          VITE_API_BASE_URL: ""
        run: pnpm build

      - name: Check current main revision
        id: current-revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_sha" = "$EXPECTED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale deployment $EXPECTED_SHA; main is $latest_sha"
          fi

      - name: Validate deployment configuration
        if: steps.current-revision.outputs.deploy == 'true'
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ADMIN_BUCKET_NAME: ${{ vars.ADMIN_BUCKET_NAME }}
          ADMIN_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.ADMIN_CLOUDFRONT_DISTRIBUTION_ID }}
          ADMIN_CLOUDFRONT_DOMAIN_NAME: ${{ vars.ADMIN_CLOUDFRONT_DOMAIN_NAME }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$ADMIN_BUCKET_NAME"
          test -n "$ADMIN_CLOUDFRONT_DISTRIBUTION_ID"
          test -n "$ADMIN_CLOUDFRONT_DOMAIN_NAME"

      - name: Configure AWS credentials
        if: steps.current-revision.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload immutable assets
        if: steps.current-revision.outputs.deploy == 'true'
        env:
          ADMIN_BUCKET_NAME: ${{ vars.ADMIN_BUCKET_NAME }}
        run: |
          aws s3 sync dist/assets/ "s3://$ADMIN_BUCKET_NAME/assets/" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Check current main revision before publish
        id: publish-revision
        if: steps.current-revision.outputs.deploy == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_sha" = "$EXPECTED_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale publish $EXPECTED_SHA; main is $latest_sha"
          fi

      - name: Publish application
        if: steps.publish-revision.outputs.publish == 'true'
        env:
          ADMIN_BUCKET_NAME: ${{ vars.ADMIN_BUCKET_NAME }}
        run: |
          aws s3 sync dist/ "s3://$ADMIN_BUCKET_NAME" \
            --exclude "assets/*" \
            --exclude "index.html" \
            --delete \
            --cache-control "public,max-age=300"
          aws s3 cp dist/index.html "s3://$ADMIN_BUCKET_NAME/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache and wait
        if: steps.publish-revision.outputs.publish == 'true'
        env:
          ADMIN_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.ADMIN_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$ADMIN_CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$ADMIN_CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"

      - name: Verify deployed application
        if: steps.publish-revision.outputs.publish == 'true'
        env:
          ADMIN_CLOUDFRONT_DOMAIN_NAME: ${{ vars.ADMIN_CLOUDFRONT_DOMAIN_NAME }}
        run: |
          curl --fail --silent --show-error \
            --retry 18 --retry-delay 10 --retry-all-errors \
            --max-time 10 \
            "https://$ADMIN_CLOUDFRONT_DOMAIN_NAME/" | grep -Fq '<div id="root"></div>'
          curl --fail --silent --show-error \
            --retry 18 --retry-delay 10 --retry-all-errors \
            --max-time 10 \
            "https://$ADMIN_CLOUDFRONT_DOMAIN_NAME/reports" | grep -Fq '<div id="root"></div>'
